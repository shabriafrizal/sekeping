[workspace]
resolver = "2"
members = [
  "crates/sekeping-core",
  "crates/sekeping-wasm",
  "crates/sekeping-cli",
]

[workspace.package]
version = "1.4.0"
edition = "2021"
license = "MIT"
authors = ["Sekeping contributors"]
repository = "https://github.com/shabriafrizal/sekeping"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
